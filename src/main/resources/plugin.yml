name: LiveSmp
version: 1.1.0
main: id.livesmp.LiveSmp
api-version: '1.21'
description: Sistem 3 nyawa SMP dengan ban 15 hari dan Revival Eye
author: ziee123

commands:
  livesmp:
    description: Perintah admin LiveSmp
    usage: /livesmp <check|revive|remove> <nama>
    permission: livesmp.admin
    permission-message: "§cKamu tidak punya izin untuk perintah ini."

permissions:
  livesmp.admin:
    default: op
  livesmp.bypass:
    default: false
